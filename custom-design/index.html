    <span class="bubble-body" data-msg-body>Pick the desk that fits. Either way, I'll take it from here.</span>

  <x-include src="desk" pos="left:3%;" key="make" icon="pencil-ruler" q="Know exactly what you’re looking for?" a="Let’s make it!"></x-include>
  <x-include src="desk" pos="right:3%;" flip key="solve" icon="lightbulb" q="Need help solving a problem?" a="Let’s build your solution together!"></x-include>
