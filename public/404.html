<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Mike's Models</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0C3A85">
<style>
  /* Self-contained on purpose: GitHub Pages serves this file at any missing path, so relative asset URLs would break. */
  html,body{margin:0;height:100%}
  body{display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;background-color:#0C3A85;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:24px 24px;font:500 17px/1.55 ui-sans-serif,system-ui,sans-serif;color:#39404F}
  main{width:min(560px,100%);box-sizing:border-box;background:#FFFFFF;border:2px solid #39404F;border-radius:4px;box-shadow:4px 4px 0 #39404F;padding:clamp(24px,4vw,40px);display:flex;flex-direction:column;gap:14px}
  span{font:700 12px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.06em;color:#0B5AD6}
  h1{margin:0;font:700 clamp(28px,4vw,40px)/1.05 ui-sans-serif,system-ui,sans-serif;letter-spacing:-.025em;color:#1B1F27}
  p{margin:0}
  a.btn{align-self:flex-start;display:inline-flex;align-items:center;height:40px;padding:0 16px;margin-top:6px;background:#1F6FEB;color:#FFFFFF;border-radius:3px;font-weight:600;text-decoration:none}
  a.btn:hover{background:#0B5AD6}
</style>
</head>
<body>
<main>
  <span>404</span>
  <h1>That page fell off the print bed.</h1>
  <p>The link might be old, or the page moved. Head back to the booth and pick a sign.</p>
  <a class="btn" href="/">Back to the booth</a>
