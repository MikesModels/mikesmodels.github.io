<!-- Page transitions (src/lib/transition.ts): about half a second of black: 0.25 s out, 0.3 s back in once the next
     page is ready (the 1.2 s timer is a safety net so a page can never stay covered). A page that was prerendered on
     hover is already built, so it fades in the moment it's shown. -->
<style>html.mm-cover::after,html.mm-leaving::after{content:"";position:fixed;inset:0;z-index:2147483647;background:#000;pointer-events:none}html.mm-cover::after{opacity:1;transition:opacity .3s cubic-bezier(.33,0,.2,1)}html.mm-cover.mm-ready::after{opacity:0}html.mm-leaving::after{opacity:1;animation:mm-out .25s cubic-bezier(.4,0,.6,1)}@keyframes mm-out{from{opacity:0}}@media (prefers-reduced-motion:reduce){html.mm-cover::after{transition-duration:.12s}html.mm-leaving::after{animation-duration:.12s}}</style>
<script>try{var r=document.documentElement;if(document.prerendering){document.addEventListener('prerenderingchange',function(){r.classList.add('mm-cover','mm-ready');r.animate&&r.animate({opacity:[1,0]},{duration:300,easing:'cubic-bezier(.33,0,.2,1)',pseudoElement:'::after'})},{once:true})}else if(sessionStorage.getItem('mm-fade')){r.classList.add('mm-cover');setTimeout(function(){r.classList.add('mm-ready')},1200)}}catch(e){}</script>
